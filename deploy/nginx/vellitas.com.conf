limit_req_zone $binary_remote_addr zone=vellitas_contact:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;

    server_name vellitas.com www.vellitas.com;
    server_tokens off;
    return 301 https://vellitas.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name vellitas.com;
    root /var/www/vellitas.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vellitas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vellitas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /api/contact {
        limit_req zone=vellitas_contact burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787/api/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_intercept_errors on;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~* \.(?:css|js|webp|png|jpe?g|svg|ico|xml|txt|webmanifest)$ {
        expires 30d;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

    access_log /var/log/nginx/vellitas.access.log;
    error_log /var/log/nginx/vellitas.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.vellitas.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vellitas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vellitas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://vellitas.com$request_uri;
}
