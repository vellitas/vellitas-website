<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="/styles.css?v=20260918-2" />
    <title>Page not found | Vellitas</title>
    <style>
      .not-found { min-height: 100svh; display: grid; place-items: center; padding: 32px; text-align: center; }
      .not-found div { max-width: 680px; }
      .not-found .wordmark { margin: 0 auto 48px; }
      .not-found .theme-toggle { position: fixed; top: 22px; right: 22px; }
      .not-found h1 { margin: 0; font-size: clamp(52px, 9vw, 110px); font-weight: 450; letter-spacing: -.05em; }
      .not-found p { margin: 20px auto 34px; color: var(--muted); font-size: 18px; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="theme-icon theme-icon--system"><rect x="3.5" y="4.5" width="17" height="12" rx="1.5" /><path d="M9 20h6M12 16.5V20" /></g>
            <g class="theme-icon theme-icon--light"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></g>
            <g class="theme-icon theme-icon--dark"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z" /></g>
          </svg>
          <span class="sr-only" data-theme-label>System theme</span>
        </button>
        <a class="wordmark wordmark--adaptive" href="/" aria-label="Vellitas home">
          <img class="wordmark__dark" src="/assets/vellitas-logo-on-dark.svg?v=20260918-2" width="1813" height="450" alt="" />
          <img class="wordmark__light" src="/assets/vellitas-logo.svg?v=20260918-2" width="1813" height="450" alt="" />
        </a>
        <h1>Signal not found.</h1>
        <p>The page you requested is outside this map.</p>
        <a class="button button--primary" href="/">Return home</a>
      </div>
    </main>
    <script src="/script.js?v=20260918-2" defer></script>
  </body>
</html>
