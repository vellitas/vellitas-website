name: Production site health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site-health
  cancel-in-progress: true

jobs:
  check:
    name: Check HTTPS site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify website, redirects, headers, and TLS lifetime
        run: ./scripts/check-production.sh
